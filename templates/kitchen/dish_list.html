{% extends "base.html" %}

{% block content %}
  <h1>Dishes</h1>
  {% if dish_list %}
    {% for dish in dish_list %}
      <ul>
        <li><a href="#"></a>{{ dish_type.name }} ( price: {{ dish.price }}), cooked by: {{ dish.cooks.username }}</li>
      </ul>
  {% endfor %}
  {% else %}
    <p>There are no dishes</p>
  {% endif %}
{% endblock %}
