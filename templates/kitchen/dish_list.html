{% extends "base.html" %}

{% block content %}
  <h1>Dishes</h1>
  {% if dish_list %}
    {% for dish in dish_list %}
      <ul>
        <li><a href="{% url 'kitchen:dish-detail' dish.id %}"><strong> {{ dish.name }} </strong>( price: {{ dish.price }}), cooked by: !!!! </a></li>
      </ul>
  {% endfor %}
  {% else %}
    <p>There are no dishes</p>
  {% endif %}
{% endblock %}
