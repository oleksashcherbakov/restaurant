{% extends "base.html" %}

{% block content %}
  <h1>Dishes <a style="float: right" href="{% url 'kitchen:dish-create' %}">+</a></h1>
  <form action="" method="get" class="d-flex">
    {{ search_form.as_p }}
    <input class="btn btn-secondary" type="submit">
  </form>
  {% if dish_list %}
    <table class="table">
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Update</th>
        <th>Delete</th>
      </tr>
      {% for dish in dish_list %}
        <tr>
          <td>{{ dish.id }}</td>
          <td>{{ dish.name }}</td>
          <td><a href="{% url 'kitchen:dish-update' pk=dish.id %}">UPDATE</a></td>
          <td><a href="{% url 'kitchen:dish-delete' pk=dish.id %}">DELETE</a></td>
        </tr>
      {% endfor %}
    </table>
  {% else %}
    <p>There are no dishes</p>
  {% endif %}
{% endblock %}
